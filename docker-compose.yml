services:
  mongodb:
    image: nesvet/mongo-rs
    container_name: queuesmart-mongodb
    restart: unless-stopped
    environment:
      MONGO_USER: ${MONGO_ROOT_USER}
      MONGO_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - ./mongo/data:/data/db
    networks:
      - queuesmart-net

  backend:
    build:
      context: ./backend
      target: production
    container_name: queuesmart-backend
    restart: unless-stopped
    environment:
      # directConnection=true, not replicaSet=rs0: the mongo image's replica
      # set is a single member that advertises itself as "localhost:27017"
      # with no way to override that (see nesvet/mongo-rs's entrypoint.sh) —
      # fine for connections from inside that container, but any other
      # container that discovers the replica-set topology gets told to
      # reconnect to a "localhost" that isn't itself. directConnection skips
      # that topology discovery and just talks to the address in this URL.
      DATABASE_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongodb:27017/queuesmart?authSource=admin&directConnection=true
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - queuesmart-net

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    container_name: queuesmart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - queuesmart-net

networks:
  queuesmart-net:
    driver: bridge
