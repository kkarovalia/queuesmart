services:
  mongodb:
    # Dev-only: lets `npm test`/Prisma Studio run from the host against the
    # same database the containers use, instead of only being reachable
    # inside the compose network.
    ports:
      - "27017:27017"

  backend:
    build:
      target: dev
    command: sh -c "npx prisma generate && npx prisma db push && npx prisma db seed && npm run dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"
      - "9229:9229"   # optional: node --inspect debugging

  frontend:
    build:
      target: dev
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"